name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Install, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # package.json requires Node 24.15.0 or newer; this installs the latest 24.x.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
